[project]
name = "email_production_flow"
version = "0.1.0"
description = "email_production_flow using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.23,<2.0.0"
]

[project.scripts]
kickoff = "email_production_flow.main:kickoff"
run_crew = "email_production_flow.main:kickoff"
plot = "email_production_flow.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "e887a801-26bc-46b5-ab28-431b656e7938"
